<!DOCTYPE html>
<html>

<head>
  <title>Memory Game - Desktop Screenshot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 1280px;
      height: 800px;
      background-color: white;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }

    .card {
      width: 100px;
      height: 140px;
      background-color: #2196F3;
      margin: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Memory Game</h1>
    <div class="cards">
      <div class="card">♠</div>
      <div class="card">♥</div>
      <div class="card">♦</div>
      <div class="card">♣</div>
      <div class="card">♠</div>
      <div class="card">♥</div>
      <div class="card">♦</div>
      <div class="card">♣</div>
    </div>
  </div>
</body>

</html>
